<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >
  <title>KotiBot Login</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/kotibot-icons.css') }}?v={{ static_version }}"
  >
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}?v={{ static_version }}"
  >
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/theme-dark.css') }}?v={{ static_version }}"
  >

  <link
    rel="icon"
    href="{{ url_for('static', filename='img/favicons/favicon.ico') }}"
    sizes="any"
  >
  <link
    rel="icon"
    type="image/svg+xml"
    href="{{ url_for('static', filename='img/favicons/favicon.svg') }}"
  >
  <link
    rel="apple-touch-icon"
    href="{{ url_for('static', filename='img/favicons/apple-touch-icon.png') }}"
  >
  <meta name="theme-color" content="#01cfff">
</head>

<body>
  <div class="app-shell">
    <div class="app-main">
      <main class="dashboard-home">
        <section
          class="dashboard-home-card dashboard-home-hero"
          aria-labelledby="loginTitle"
        >
          <img
            class="dashboard-home-logo"
            src="{{ url_for('static', filename='img/KotiBot.svg') }}"
            alt=""
          >

          <div class="dashboard-home-title-wrap">
            <h1
              id="loginTitle"
              class="dashboard-home-title"
            >KotiBot</h1>

            <div class="dashboard-home-subtitle">
              Smart Home Command Center
            </div>
          </div>
        </section>

        <div class="dashboard-home-control-wrap">
          {% if login_configured %}
            <form
              class="dashboard-home-card"
              method="post"
              action="/login"
              autocomplete="on"
            >
              <label
                class="client-menu-inline-field"
                for="loginEmail"
              >
                <span class="client-menu-label">Email</span>

                <input
                  id="loginEmail"
                  class="form-input client-menu-input"
                  name="email"
                  type="email"
                  autocomplete="username"
                  autocapitalize="none"
                  spellcheck="false"
                  maxlength="254"
                  required
                  autofocus
                >
              </label>

              <label
                class="client-menu-inline-field"
                for="loginPassword"
              >
                <span class="client-menu-label">Password</span>

                <input
                  id="loginPassword"
                  class="form-input client-menu-input"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  maxlength="256"
                  required
                >
              </label>

              {% if login_error %}
                <div class="client-menu-inline-field">
                  <span
                    class="client-menu-label"
                    aria-hidden="true"
                  ></span>

                  <span
                    class="environment-error-text"
                    role="alert"
                  >
                    {{ login_error }}
                  </span>
                </div>
              {% endif %}

              <div class="client-menu-inline-field">
                <span
                  class="client-menu-label"
                  aria-hidden="true"
                ></span>

                <button
                  class="settings-item client-menu-input"
                  type="submit"
                >
                  Login
                </button>
              </div>
            </form>
          {% else %}
            <section class="dashboard-home-card">
              <div class="client-menu-inline-field">
                <span
                  class="client-menu-label"
                  aria-hidden="true"
                ></span>

                <span
                  class="environment-error-text"
                  role="alert"
                >
                  Configure an email/password dashboard user locally
                  before accessing KotiBot.
                </span>
              </div>
            </section>
          {% endif %}
        </div>
      </main>
    </div>
  </div>
</body>
</html>
