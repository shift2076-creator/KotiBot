<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KotiBot Dashboard</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/kotibot-icons.css') }}?v={{ static_version }}">

  <script nonce="{{ csp_nonce }}">
    window.dashboardStaticVersion = "{{ static_version }}";
    window.KOTIBOT_STATIC_VERSION = "{{ static_version }}";
    window.KOTIBOT_TAPO_ENABLED = {{ tapo_enabled | tojson }};
    window.KOTIBOT_BOOTSTRAP = {{ dashboard_bootstrap | tojson }};
    window.KOTIBOT_BOOTSTRAP_RECEIVED_AT_MS = Date.now();

    (() => {
      const theme = localStorage.getItem("dashboardTheme") === "light" ? "light" : "dark";
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ static_version }}">
  <link id="dashboardThemeCss" rel="stylesheet" href="{{ url_for('static', filename='css/theme-dark.css') }}?v={{ static_version }}">

  <link rel="icon" href="{{ url_for('static', filename='img/favicons/favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicons/favicon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/favicons/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='img/favicons/site.webmanifest') }}">
  <meta name="theme-color" content="#01CFFF">
</head>

<body>
  <div id="appShell" class="app-shell">
    <aside id="dashboardAside" class="dashboard-aside" aria-label="Dashboard navigation"></aside>

    <div class="app-main">
      <section class="section" id="sectionClients" style="display:none;">
        <div>
          <div id="clientCards" class="cards"></div>
          <div id="cameraClients" class="camera-cards"></div>
        </div>
      </section>
      
      <section id="sectionEmpty" class="section" style="display:none; text-align:center; padding:clamp(2rem, 6vw, 3.75rem);">
        No clients connected.
      </section>

      <section class="section" id="sectionLog" style="display:none;">
        <div class="log-shell">
          <div class="log-card card">
            <div class="card-head log-card-head">
              <div class="status-area">
                <span class="koti-icon koti-fa-terminal status-mic" aria-hidden="true"></span>
              </div>

              <div class="log-toolbar">
                <select id="logClientFilter" class="log-select" data-dashboard-change="apply-log-filters">
                  <option value="">All Clients / Server</option>
                </select>

                <label class="log-check">
                  <input type="checkbox" id="debugLevelInfo" checked data-dashboard-change="apply-log-filters">
                  <span>INFO</span>
                </label>

                <label class="log-check">
                  <input type="checkbox" id="debugLevelWarning" checked data-dashboard-change="apply-log-filters">
                  <span>WARNING</span>
                </label>

                <label class="log-check">
                  <input type="checkbox" id="debugLevelError" checked data-dashboard-change="apply-log-filters">
                  <span>ERROR</span>
                </label>

                <label class="log-check">
                  <input type="checkbox" id="debugLevelCritical" checked data-dashboard-change="apply-log-filters">
                  <span>CRITICAL</span>
                </label>
              </div>
            </div>

            <textarea id="logBox" class="log-box" readonly spellcheck="false"></textarea>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/dashboard-state.js') }}?v={{ static_version }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard-utils.js') }}?v={{ static_version }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard-api.js') }}?v={{ static_version }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard-render.js') }}?v={{ static_version }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard-main.js') }}?v={{ static_version }}"></script>
</body>
</html>
